[project]
name = "groqdemo"
description = "querychat on Groq (Qwen) — minimal Shiny for Python demo for DSCI 532"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chatlas>=0.23.0",
    "python-dotenv>=1.2.4",
    "querychat>=0.9.0",
    "seaborn>=0.13.2",
    "shiny>=1.8.0",
]

[dependency-groups]
evals = [
    "duckdb>=1.5.6",
    "inspect-ai>=0.3.277",
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evals/tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]
